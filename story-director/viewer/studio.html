<style>

button { font-family: inherit; cursor: pointer; }
input, select, textarea { font-family: inherit; }

#tlScroll { flex: 1; overflow-x: auto; overflow-y: auto; position: relative; }
#tlInner { position: relative; min-height: 100%; }
.tlrow { height: 26px; position: relative; border-bottom: 1px solid #1e222c; }
.tlrow .head { position: sticky; left: 0; width: 70px; height: 100%; background: #1b1e27; color: #9db8ff; font-size: 11px; display: flex; align-items: center; padding-left: 8px; z-index: 5; border-right: 1px solid #2a2e3a; }
.tlrow .area { position: absolute; left: 70px; right: 0; top: 0; height: 100%; cursor: crosshair; }
.ev { position: absolute; top: 2px; height: 22px; border-radius: 4px; font-size: 11px; line-height: 22px; padding: 0 6px; white-space: nowrap; overflow: hidden; cursor: pointer; color: #fff; }
.ev.sel { outline: 2px solid #fff; z-index: 3; }
.t-env { background: #2e6b40; } .t-camera { background: #6b4db8; } .t-sub { background: #4a6b8c; }
.t-act { background: #8c5a2e; } .t-talk { background: #8c2f5a; } .t-move { background: #2e6b8c; }

<body>
<div id="topbar">
  <b>故事导演</b>
  <button id="playBtn">▶ 播放</button>

  <button id="stopBtn">■</button>

    <input id="impFile" type="file" accept=".json" style="display:none"></label>

        <button data-env="白天" class="on">白天</button><button data-env="黄昏">黄昏</button>

      <div id="tlBar">
        <b style="color:#9db8ff">时间轴</b>
        <span style="color:#8b93a5">单击轨道空白处=新建 · 点色块=编辑 · 拖红色线=跳转</span>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { VRMLoaderPlugin, VRMUtils } from '@pixiv/three-vrm';
import { VRMAnimationLoaderPlugin, VRMLookAtQuaternionProxy, createVRMAnimationClip } from '@pixiv/three-vrm-animation';

const $ = (s) => document.querySelector(s);
const $$ = (s) => document.querySelectorAll(s);
const statusEl = $('#status');
const setStatus = (t) => { const el = $('#status'); if (el) el.textContent = t; };
const FPS = 30;

// ---------- 中文动作别名 ----------
const ALIAS = {
  '挥手':'avatar_hello','打招呼':'avatar_hello','鞠躬':'avatar_bow','拍手':'avatar_clap','鼓掌':'avatar_clap',
  '跳':'avatar_jump','跳跃':'avatar_jump','后空翻':'avatar_backflip','走':'avatar_walk','走路':'avatar_walk',
  '跑步':'avatar_run','跑':'avatar_run','跳舞':'avatar_dance1','跳舞1':'avatar_dance1','跳舞2':'avatar_dance2',
  '跳舞3':'avatar_dance3','坐下':'avatar_sit_ground','坐':'avatar_sit_ground','睡觉':'avatar_sleep','睡':'avatar_sleep',
  '开心':'avatar_express_laugh','笑':'avatar_express_laugh','大笑':'avatar_express_laugh','难过':'avatar_express_sad',
  '生气':'avatar_express_anger','惊讶':'avatar_express_surprise','吃惊':'avatar_express_surprise',
  '害羞':'avatar_express_embarrased','担忧':'avatar_express_worry','眨眼':'avatar_express_wink',
  '耸肩':'avatar_express_shrug','敬礼':'avatar_salute','点头':'avatar_yes_head','摇头':'avatar_no_head',
  '指我':'avatar_point_me','指你':'avatar_point_you','伸懒腰':'avatar_stretch','加油':'avatar_fist_pump',
  '喝水':'avatar_drink','飞吻':'avatar_blowkiss','吹口哨':'avatar_whistle','告别':'avatar_away',
  '说话':'avatar_talk','打字':'avatar_type','思考':'avatar_type','站立':'avatar_stand',
};
const resolveAnim = (n) => ALIAS[n] || (n.startsWith('avatar_') || n.startsWith('cmu_') || n === 'idle_loop' ? n : 'avatar_' + n);
const ANIM_LIST = ['挥手','鞠躬','拍手','跳','后空翻','走','跑步','跳舞','跳舞2','跳舞3','坐下','睡觉','开心','大笑','难过','生气','惊讶','害羞','担忧','眨眼','耸肩','敬礼','点头','摇头','指我','指你','伸懒腰','加油','喝水','飞吻','吹口哨','告别','说话','打字','站立','idle_loop'];

// ---------- 舞台 ----------
const stageEl = $('#stage');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(stageEl.clientWidth, stageEl.clientHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
stageEl.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87a8d0);

const camera = new THREE.PerspectiveCamera(35, stageEl.clientWidth / stageEl.clientHeight, 0.1, 200);
camera.position.set(0, 1.5, 4.2);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.95, 0);
controls.enableDamping = true;

scene.add(new THREE.AmbientLight(0xffffff, 0.65));
const sun = new THREE.DirectionalLight(0xffffff, 1.6);
sun.position.set(2, 4, 3);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
scene.add(sun);
scene.add(new THREE.DirectionalLight(0x8899ff, 0.3));

const ground = new THREE.Mesh(new THREE.CircleGeometry(14, 48),
  new THREE.MeshStandardMaterial({ color: 0x5d7a4a, roughness: 1 }));
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

window.addEventListener('resize', () => {
  renderer.setSize(stageEl.clientWidth, stageEl.clientHeight);
  camera.aspect = stageEl.clientWidth / stageEl.clientHeight;
  camera.updateProjectionMatrix();
});

// ---------- 加载器 ----------
const draco = new DRACOLoader();
draco.setDecoderPath('/node_modules/three/examples/jsm/libs/draco/gltf/');
const loader = new GLTFLoader();
loader.setDRACOLoader(draco);
loader.register((p) => new VRMLoaderPlugin(p));
loader.register((p) => new VRMAnimationLoaderPlugin(p));
const loadGLTF = (url) => new Promise((res, rej) => loader.load(url, res, undefined,
  (e) => rej(new Error(e.message || '加载失败'))));

const clipCache = {};
async function getClip(actor, animName) {
  const key = actor.模型 + '/' + animName;
  if (clipCache[key]) return clipCache[key];
  const agltf = await loadGLTF('/actions/' + encodeURIComponent(animName) + '.vrma');
  const anim = agltf.userData.vrmAnimations[0];
  if (!anim) return null;
  const clip = createVRMAnimationClip(anim, actor.vrm);
  clipCache[key] = clip;
  return clip;
}

// ---------- 演员 ----------
const R = { actors: {}, clock: 0, playing: false, paused: false, ended: false, evIdx: 0, isRec: false };

async function importActor(name, modelFile, initPos) {
  status('导入演员 ' + name + ' …');
  const gltf = await loadGLTF('/models/' + encodeURIComponent(modelFile));
  const vrm = gltf.userData.vrm;
  const proxy = new VRMLookAtQuaternionProxy();
  proxy.name = 'VRMLookAtQuaternionProxy_' + name + '_' + Math.random().toString(36).slice(2, 5);
  gltf.scene.add(proxy);
  gltf.scene.traverse(o => { if (o.isMesh) { o.castShadow = true; o.frustumCulled = false; } });
  const p = initPos || [0, 0];
  gltf.scene.position.set(p[0], 0, p[1]);
  gltf.scene.rotation.y = Math.PI;
  gltf.scene.name = '演员_' + name;
  scene.add(gltf.scene);
  const mixer = new THREE.AnimationMixer(gltf.scene);
  const actor = {
    名字: name, 模型文件: modelFile, obj: gltf.scene, vrm, mixer,
    action: null, actionName: 'idle_loop', actionEnd: 0, voiceUntil: 0,
    _moveTween: null, _walkTarget: null,
  };
  R.actors[name] = actor;
  playAction(actor, 'idle_loop', true, 1e9);
  renderActorList();
  return actor;
}

function actorFace(actor, point) {
  const dx = point.x - actor.obj.position.x;
  const dz = point.z - actor.obj.position.z;
  if (Math.sqrt(dx * dx + dz * dz) > 0.01) actor.obj.rotation.y = Math.atan2(dx, dz);
}

function actorWalkTo(actor, target, duration) {
  actorFace(actor, target);
  if (actor._moveTween) actor._moveTween.kill();
  playAction(actor, 'avatar_walk', true);
  actor._moveTween = actor.createTween();
  actor._moveTween.tweenProperty(actor.obj, 'position', target, Math.max(duration, 0.05));
  actor._moveTween.tweenCallback(() => { playAction(actor, 'idle_loop', true); });
}

// ---------- TTS ----------
const audioCtx = new AudioContext();
const recDest = audioCtx.createMediaStreamDestination();
const voiceEls = {};
let bgmEl = null;
function wireAudio(el) {
  try {
    const src = audioCtx.createMediaElementSource(el);
    src.connect(audioCtx.destination);
    src.connect(recDest);
  } catch (e) { /* 已接线 */ }
}
function playVoiceFile(name) {
  let el = voiceEls[name];
  if (!el) { el = new Audio(name.startsWith('/') ? name : '/voice/' + name); el.preload = 'auto'; wireAudio(el); voiceEls[name] = el; }
  el.currentTime = 0;
  el.play().catch(() => {});
}
function playBGM(file) {
  if (!bgmEl) { bgmEl = new Audio(file || '/audio/bgm.wav'); bgmEl.loop = true; wireAudio(bgmEl); }
  bgmEl.play().catch(() => {});
}
function stopBGM() { if (bgmEl) bgmEl.pause(); }

// ---------- 环境光照 ----------
const ENV = {
  '白天': { sky: 0x87a8d0, sunC: 0xffffff, sunI: 1.6, sunP: [2, 4, 3], amb: 0.65 },
  '黄昏': { sky: 0xf0a167, sunC: 0xff8c4d, sunI: 2.2, sunP: [-4, 1.5, 3], amb: 0.5 },
  '夜晚': { sky: 0x0a0e1a, sunC: 0x8ca6ff, sunI: 0.5, sunP: [-3, 4, -2], amb: 0.35 },
  '黎明': { sky: 0xe8b08c, sunC: 0xffb88c, sunI: 1.8, sunP: [5, 2, -3], amb: 0.5 },
};
let envLerp = null;
let currentAmbient = 0.65;
function applyEnvPreset(name) {
  const p = ENV[name] || ENV['白天'];
  envLerp = { from: { sky: scene.background.clone(), sunC: sun.color.clone(), sunI: sun.intensity, sunP: sun.position.clone(), amb: currentAmbient },
              to: p, t0: R.clock, dur: 1.2 };
  $$('#envBtns button').forEach(b => b.classList.toggle('on', b.dataset.env === name));
}
function tickEnv() {
  if (!envLerp) return;
  const k = Math.min(1, (R.clock - envLerp.t0) / envLerp.dur);
  scene.background.lerpColors(envLerp.from.sky, envLerp.to.sky, k);
  sun.color.lerpColors(envLerp.from.sunC, envLerp.to.sunC, k);
  sun.intensity = envLerp.from.sunI + (envLerp.to.sunI - envLerp.from.sunI) * k;
  sun.position.lerpVectors(envLerp.from.sunP, envLerp.to.sunP, k);
  currentAmbient = envLerp.from.amb + (envLerp.to.amb - envLerp.from.amb) * k;
  ambientLight.intensity = currentAmbient;
  if (k >= 1) envLerp = null;
}

// ---------- 场景 GLB ----------
let sceneGroup = null;
async function loadSceneGLB(file) {
  status('切换场景 ' + (file || '默认草原') + ' …');
  if (sceneGroup) { scene.remove(sceneGroup); disposeTree(sceneGroup); sceneGroup = null; }
  ground.visible = !file;
  if (!file) { status('已恢复默认草原'); return; }
  try {
    const gltf = await loadGLTF('/scenes/' + encodeURIComponent(file));
    sceneGroup = gltf.scene;
    const box = new THREE.Box3().setFromObject(sceneGroup);
    const size = box.getSize(new THREE.Vector3());
    const maxDim = Math.max(size.x, size.y, size.z) || 1;
    sceneGroup.scale.setScalar(18 / maxDim);
    const box2 = new THREE.Box3().setFromObject(sceneGroup);
    const center = box2.getCenter(new THREE.Vector3());
    sceneGroup.position.x -= center.x;
    sceneGroup.position.z -= center.z;
    sceneGroup.position.y -= box2.min.y;
    scene.add(sceneGroup);
    status('场景已切换: ' + file);
  } catch (e) { status('⚠ 场景加载失败: ' + e.message); ground.visible = true; }
}
function disposeTree(obj) {
  obj.traverse(o => {
    if (o.geometry) o.geometry.dispose();
    if (o.material) { for (const m of Array.isArray(o.material) ? o.material : [o.material]) { for (const k in m) if (m[k] && m[k].isTexture) m[k].dispose(); m.dispose(); } }
  });
}
</script>

  const anim = agltf.userData.vrmAnimations[0];
  if (!anim) return null;
  const clip = createVRMAnimationClip(anim, actor.vrm);
  clipCache[key] = clip;
  return clip;
}

function playAction(actor, animName, loop, holdSec) {
  return getClip(actor, animName).then(clip => {
    if (!clip) { if (animName !== 'idle_loop') playAction(actor, 'idle_loop', true, 1e9); return; }
    if (actor.action) actor.action.stop();
    actor.action = actor.mixer.clipAction(clip);
    actor.action.setLoop(loop ? THREE.LoopRepeat : THREE.LoopOnce, loop ? Infinity : 1);
    actor.action.clampWhenFinished = !loop;
    actor.action.reset().play();
    actor.actionName = animName;
    const dur = Number.isFinite(clip.duration) ? clip.duration : 2;
    actor.actionEnd = R.clock + (loop ? (holdSec || 3) : dur);
  }).catch(() => status('⚠ 动作加载失败: ' + animName));
}

function actorFace(actor, point) {
  const dx = point.x - actor.obj.position.x;
  const dz = point.z - actor.obj.position.z;
  if (Math.sqrt(dx * dx + dz * dz) > 0.01) actor.obj.rotation.y = Math.atan2(dx, dz);
}

function actorWalkTo(actor, target, duration) {
  actorFace(actor, target);
  if (actor._moveTween) actor._moveTween.kill();
  playAction(actor, 'avatar_walk', true);
  actor._moveTween = actor.createTween();
  actor._moveTween.tweenProperty(actor.obj, 'position', target, Math.max(duration, 0.05));
  actor._moveTween.tweenCallback(() => { playAction(actor, 'idle_loop', true); });
}

// ---------- TTS ----------
const audioCtx = new AudioContext();
const recDest = audioCtx.createMediaStreamDestination();
const voiceEls = {};
let bgmEl = null;
function wireAudio(el) {
  try { const src = audioCtx.createMediaElementSource(el); src.connect(audioCtx.destination); src.connect(recDest); } catch (e) {}
}
function playVoiceFile(name) {
  let el = voiceEls[name];
  if (!el) { el = new Audio(name.startsWith('/') ? name : '/voice/' + name); el.preload = 'auto'; wireAudio(el); voiceEls[name] = el; }
  el.currentTime = 0;
  el.play().catch(() => {});
}
function playBGM(file) {
  if (!bgmEl) { bgmEl = new Audio(file || '/audio/bgm.wav'); bgmEl.loop = true; wireAudio(bgmEl); }
  bgmEl.play().catch(() => {});
}
function stopBGM() { if (bgmEl) bgmEl.pause(); }

// ---------- 环境光照 ----------
const ENV = {
  '白天': { sky: 0x87a8d0, sunC: 0xffffff, sunI: 1.6, sunP: [2, 4, 3] },
  '黄昏': { sky: 0xf0a167, sunC: 0xff8c4d, sunI: 2.2, sunP: [-4, 1.5, 3] },
  '夜晚': { sky: 0x0a0e1a, sunC: 0x8ca6ff, sunI: 0.5, sunP: [-3, 4, -2] },
  '黎明': { sky: 0xe8b08c, sunC: 0xffb88c, sunI: 1.8, sunP: [5, 2, -3] },
};
let envLerp = null;
function applyEnvPreset(name) {
  const p = ENV[name] || ENV['白天'];
  envLerp = { from: { sky: scene.background.clone(), sunC: sun.color.clone(), sunI: sun.intensity, sunP: sun.position.clone() },
              to: p, t0: R.clock, dur: 1.2 };
  $$('#envBtns button').forEach(b => b.classList.toggle('on', b.dataset.env === name));
}
function tickEnv() {
  if (!envLerp) return;
  const k = Math.min(1, (R.clock - envLerp.t0) / envLerp.dur);
  scene.background.lerpColors(envLerp.from.sky, envLerp.to.sky, k);
  sun.color.lerpColors(envLerp.from.sunC, envLerp.to.sunC, k);
  sun.intensity = envLerp.from.sunI + (envLerp.to.sunI - envLerp.from.sunI) * k;
  sun.position.lerpVectors(envLerp.from.sunP, envLerp.to.sunP, k);
  if (k >= 1) envLerp = null;
}

// ---------- 场景 GLB ----------
let sceneGroup = null;
async function loadSceneGLB(file) {
  status('切换场景 ' + (file || '默认草原') + ' …');
  if (sceneGroup) { scene.remove(sceneGroup); disposeTree(sceneGroup); sceneGroup = null; }
  ground.visible = !file;
  if (!file) { status('已恢复默认草原'); return; }
  try {
    const gltf = await loadGLTF('/scenes/' + encodeURIComponent(file));
    sceneGroup = gltf.scene;
    const box = new THREE.Box3().setFromObject(sceneGroup);
    const size = box.getSize(new THREE.Vector3());
    const maxDim = Math.max(size.x, size.y, size.z) || 1;
    sceneGroup.scale.setScalar(18 / maxDim);
    const box2 = new THREE.Box3().setFromObject(sceneGroup);
    const center = box2.getCenter(new THREE.Vector3());
    sceneGroup.position.x -= center.x;
    sceneGroup.position.z -= center.z;
    sceneGroup.position.y -= box2.min.y;
    scene.add(sceneGroup);
    status('场景已切换: ' + file);
  } catch (e) { status('⚠ 场景加载失败: ' + e.message); ground.visible = true; }
}
function disposeTree(obj) {
  obj.traverse(o => {
    if (o.geometry) o.geometry.dispose();
    if (o.material) { for (const m of Array.isArray(o.material) ? o.material : [o.material]) { for (const k in m) if (m[k] && m[k].isTexture) m[k].dispose(); m.dispose(); } }
  });
}
